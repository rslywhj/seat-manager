<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>数据修复工具</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 800px;
      margin: 50px auto;
      padding: 20px;
      background: #0b1220;
      color: #e8eefc;
    }
    h1 { color: #6366f1; }
    .step {
      background: #111a2e;
      padding: 20px;
      margin: 20px 0;
      border-radius: 8px;
      border-left: 4px solid #6366f1;
    }
    button {
      background: #6366f1;
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 16px;
      margin: 5px;
    }
    button:hover { background: #4f46e5; }
    .status {
      padding: 15px;
      margin: 10px 0;
      border-radius: 5px;
      font-family: monospace;
      white-space: pre-wrap;
    }
    .success { background: #16a34a20; border-left: 4px solid #22c55e; }
    .error { background: #dc262620; border-left: 4px solid #ef4444; }
    .warn { background: #ea580c20; border-left: 4px solid #f59e0b; }
    .info { background: #2563eb20; border-left: 4px solid #3b82f6; }
    input {
      width: 100%;
      padding: 10px;
      margin: 10px 0;
      background: #0f1730;
      border: 1px solid #223056;
      color: #e8eefc;
      border-radius: 4px;
      font-size: 14px;
    }
    label {
      display: block;
      margin-top: 10px;
      color: #9fb0d6;
      font-weight: bold;
    }
    .btn-danger {
      background: #ef4444;
    }
    .btn-danger:hover {
      background: #dc2626;
    }
  </style>
</head>
<body>

<h1>🔧 数据修复工具</h1>
<p>此工具修复没有 <code>_id</code> 字段的旧数据，确保所有数据都能同步到服务器。</p>

<div class="step">
  <h2>配置</h2>
  <label>API Base URL:</label>
  <input type="text" id="apiBase" value="https://seat.dougge.top/api" />
  <label>Floor ID:</label>
  <input type="text" id="floorId" value="floor_d8" />
  <label>LocalStorage Key:</label>
  <input type="text" id="storageKey" value="D8F-floor-twins-v2" />
</div>

<div class="step">
  <h2>步骤 1: 检查数据</h2>
  <p>分析 localStorage 中的数据，查找没有 _id 的区域和工位</p>
  <button onclick="checkData()">检查数据</button>
  <div id="checkResult"></div>
</div>

<div class="step">
  <h2>步骤 2: 修复数据</h2>
  <p>将没有 _id 的数据上传到服务器，获取正确的 _id</p>
  <button onclick="fixData()">修复数据</button>
  <div id="fixResult"></div>
</div>

<div class="step">
  <h2>步骤 3: 清空重新加载（可选）</h2>
  <p style="color: #f59e0b;">⚠️ 警告：这将清空 localStorage 并从服务器重新加载数据</p>
  <button class="btn-danger" onclick="clearAndReload()">清空并重新加载</button>
  <div id="clearResult"></div>
</div>

<script>
let apiBase, floorId, storageKey;

function getConfig() {
  apiBase = document.getElementById('apiBase').value;
  floorId = document.getElementById('floorId').value;
  storageKey = document.getElementById('storageKey').value;
}

function showResult(containerId, message, type = 'info') {
  document.getElementById(containerId).innerHTML =
    `<div class="status ${type}">${message}</div>`;
}

function checkData() {
  getConfig();

  try {
    const raw = localStorage.getItem(storageKey);
    if (!raw) {
      showResult('checkResult', '❌ 未找到数据', 'error');
      return;
    }

    const data = JSON.parse(raw);
    const zonesWithoutId = data.zones.filter(z => !z._id);
    const zonesWithId = data.zones.filter(z => z._id);

    let result = `检查结果：\n\n`;
    result += `总区域数: ${data.zones.length}\n`;
    result += `有 _id 的区域: ${zonesWithId.length}\n`;
    result += `没有 _id 的区域: ${zonesWithoutId.length}\n\n`;

    if (zonesWithoutId.length > 0) {
      result += `需要修复的区域：\n`;
      zonesWithoutId.forEach(z => {
        result += `- ${z.name} (${z.code})\n`;
      });
      result += `\n⚠️ 这些区域没有同步到服务器！`;
      showResult('checkResult', result, 'warn');
    } else {
      result += `✓ 所有区域都有 _id，无需修复`;
      showResult('checkResult', result, 'success');
    }

  } catch (error) {
    showResult('checkResult', `❌ 错误: ${error.message}`, 'error');
  }
}

async function fixData() {
  getConfig();

  try {
    const raw = localStorage.getItem(storageKey);
    if (!raw) {
      showResult('fixResult', '❌ 未找到数据', 'error');
      return;
    }

    const data = JSON.parse(raw);
    const zonesWithoutId = data.zones.filter(z => !z._id);

    if (zonesWithoutId.length === 0) {
      showResult('fixResult', '✓ 所有数据都正常，无需修复', 'success');
      return;
    }

    let result = `开始修复 ${zonesWithoutId.length} 个区域...\n\n`;
    showResult('fixResult', result, 'info');

    let fixed = 0;
    let failed = 0;

    for (const zone of zonesWithoutId) {
      try {
        result += `修复区域: ${zone.name}...`;

        // 创建区域到服务器
        const response = await fetch(`${apiBase}/floors/${floorId}/zones`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            name: zone.name,
            code: zone.code,
            x: zone.x || 0,
            y: zone.y || 0,
            width: zone.width || 300,
            height: zone.height || 400,
            count: zone.count || 100,
            rows: zone.rows || 10,
            cols: zone.cols || 10,
            order: zone.order || 'row',
            color: zone.color || '#6366f1'
          })
        });

        if (!response.ok) {
          throw new Error(`HTTP ${response.status}`);
        }

        const apiData = await response.json();

        // 更新本地数据
        zone._id = apiData.data.zone._id;
        zone.version = apiData.data.zone.version;
        zone.id = zone._id.toString();

        result += ` ✓ 成功 (ID: ${zone._id})\n`;
        fixed++;

      } catch (error) {
        result += ` ❌ 失败: ${error.message}\n`;
        failed++;
      }

      showResult('fixResult', result, 'info');
      await new Promise(resolve => setTimeout(resolve, 500));
    }

    // 保存更新后的数据
    localStorage.setItem(storageKey, JSON.stringify(data));

    result += `\n========================================\n`;
    result += `修复完成!\n`;
    result += `成功: ${fixed}\n`;
    result += `失败: ${failed}\n`;
    result += `========================================\n\n`;
    result += `✓ 数据已保存，请刷新应用页面`;

    showResult('fixResult', result, fixed > 0 ? 'success' : 'warn');

  } catch (error) {
    showResult('fixResult', `❌ 错误: ${error.message}`, 'error');
  }
}

async function clearAndReload() {
  if (!confirm('确定要清空本地数据并从服务器重新加载吗？\n\n警告：未同步到服务器的数据将丢失！')) {
    return;
  }

  getConfig();

  try {
    let result = '正在清空本地数据...\n';
    showResult('clearResult', result, 'info');

    // 清空 localStorage
    localStorage.removeItem(storageKey);
    result += '✓ 本地数据已清空\n\n';

    // 从服务器加载数据
    result += '正在从服务器加载数据...\n';
    showResult('clearResult', result, 'info');

    const response = await fetch(`${apiBase}/floors/${floorId}`);
    if (!response.ok) {
      throw new Error(`HTTP ${response.status}`);
    }

    const apiData = await response.json();

    result += `✓ 加载成功\n`;
    result += `  区域数: ${apiData.data.zones.length}\n`;
    result += `  工位数: ${apiData.data.seats.length}\n\n`;

    // 转换格式并保存
    const seatsObj = {};
    for (const seat of apiData.data.seats) {
      seatsObj[seat._id.toString()] = seat;
    }

    const newData = {
      floor: apiData.data.floor,
      zones: apiData.data.zones,
      seats: seatsObj
    };

    localStorage.setItem(storageKey, JSON.stringify(newData));

    result += `✓ 数据已保存到 localStorage\n\n`;
    result += `========================================\n`;
    result += `✓ 完成！请刷新应用页面\n`;
    result += `========================================`;

    showResult('clearResult', result, 'success');

    setTimeout(() => {
      if (confirm('修复完成！是否立即刷新页面？')) {
        window.location.href = 'index.html';
      }
    }, 1000);

  } catch (error) {
    showResult('clearResult', `❌ 错误: ${error.message}`, 'error');
  }
}

// 自动检查
window.addEventListener('DOMContentLoaded', () => {
  setTimeout(checkData, 500);
});
</script>

</body>
</html>
