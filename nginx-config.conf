# Nginx 配置 - 用于 seat.dougge.top
# 放置在 /etc/nginx/sites-available/seat-manager

upstream seat_backend {
    server 127.0.0.1:3000;
    keepalive 64;
}

# HTTP 重定向到 HTTPS（如果有 SSL 证书）
server {
    listen 80;
    listen [::]:80;
    server_name seat.dougge.top;

    # 如果没有 SSL，注释掉下面这行
    # return 301 https://$server_name$request_uri;

    # 如果没有 SSL，取消注释下面的配置
    location / {
        proxy_pass http://seat_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # WebSocket 支持
        proxy_read_timeout 86400;
    }

    location /socket.io/ {
        proxy_pass http://seat_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # WebSocket 超时设置
        proxy_connect_timeout 7d;
        proxy_send_timeout 7d;
        proxy_read_timeout 7d;
    }
}

# HTTPS 配置（如果有 SSL 证书）
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name seat.dougge.top;

    # SSL 证书路径（修改为你的证书路径）
    ssl_certificate /etc/nginx/ssl/seat.dougge.top.crt;
    ssl_certificate_key /etc/nginx/ssl/seat.dougge.top.key;

    # SSL 配置
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # API 路由
    location /api/ {
        proxy_pass http://seat_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # WebSocket 路由
    location /socket.io/ {
        proxy_pass http://seat_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket 超时设置
        proxy_connect_timeout 7d;
        proxy_send_timeout 7d;
        proxy_read_timeout 7d;
    }

    # 健康检查
    location /health {
        proxy_pass http://seat_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # 静态文件（如果需要）
    location / {
        root /seat-manager;
        try_files $uri $uri/ /index.html;
        index index.html;
    }
}
